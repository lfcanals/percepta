<!DOCTYPE html>
<html>
<head>
  <title>Calibration UI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      height: 100vh;
    }

    .left {
      flex: 3;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }

    .right {
      flex: 1;
      background: #1e1e1e;
      padding: 20px;
      border-left: 1px solid #333;
    }

    #video {
      width: 100%;
      height: 70%;
      object-fit: contain;
      background: black;
      border-radius: 8px;
    }

    .calibrations {
      margin-top: 10px;
      background: #1a1a1a;
      padding: 10px;
      border-radius: 8px;
      overflow-y: auto;
    }

    .calibration-item {
      padding: 8px;
      margin: 4px 0;
      background: #2a2a2a;
      border-radius: 5px;
      cursor: pointer;
    }

    .calibration-item:hover {
      background: #3a3a3a;
    }

    .calibration-item.active {
      background: #4caf50;
      color: black;
    }

    .btn {
      display: block;
      text-align: center;
      padding: 12px;
      margin-bottom: 10px;
      font-size: 16px;
      border-radius: 6px;
      text-decoration: none;
      background: #4caf50;
      color: black;
    }

    .btn:hover {
      background: #66bb6a;
    }
  </style>
</head>

<body>

<div class="left">
  <img id="video" src="/raw_video_feed/front-camera?calibration=original">

  <div class="calibrations">
    <div class="calibration-item active" data-calib="original">
      Original (no calibration)
    </div>
    <div class="calibration-item" data-calib="calibA">
      Calibration A
    </div>
    <div class="calibration-item" data-calib="calibB">
      Calibration B
    </div>
  </div>
</div>

<div class="right">
  <a class="btn" href="/calibrate/front-camera">Calibrate</a>
  <a class="btn" href="/manage_calibrations">Manage calibrations</a>
</div>

<script>
  const video = document.getElementById("video");

  document.querySelectorAll(".calibration-item").forEach(item => {
    item.onclick = () => {
      // Update active style
      document.querySelectorAll(".calibration-item")
        .forEach(i => i.classList.remove("active"));
      item.classList.add("active");

      // Get calibration value
      const calib = item.dataset.calib;

      // Update video URL
      video.src = `/raw_video_feed/front-camera?calibration=${calib}`;
    };
  });
</script>

</body>
</html>
